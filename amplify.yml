version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Vite 8 requires Node >= 22.12. Ensure the build uses Node 22.
        - nvm install 22
        - nvm use 22
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    # Vite outputs the production build to the "dist" folder.
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
