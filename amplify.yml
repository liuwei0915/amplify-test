version: 1
backend:
  phases:
    build:
      commands:
        # Vite 8 requires Node >= 22.12. Ensure the build uses Node 22.
        - nvm install 22
        - nvm use 22
        - npm install
        # Deploys the Amplify backend (data, auth) for this branch and writes
        # amplify_outputs.json, which the frontend imports at build time.
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22
        # Use "npm install" rather than "npm ci": it tolerates cross-platform
        # optional-dependency differences (lock generated on macOS arm64, build
        # runs on Linux x64) and keeps the lock file in sync.
        - npm install
    build:
      commands:
        - npm run build
  artifacts:
    # Vite outputs the production build to the "dist" folder.
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
